<header class="navbar">
  <div class="navbar-container">
    <div class="navbar-brand">
      <app-logo></app-logo>
    </div>
    <nav id="primary-navigation" class="nav-menu" [class.active]="menuOpen">
      <div class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()" class="nav-link">
          Home
        </a>
        <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()" class="nav-link">
          About
        </a>
        <a routerLink="/services" routerLinkActive="active" (click)="closeMenu()" class="nav-link">
          Services
        </a>
        <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()" class="nav-link">
          Contact
        </a>
        <a class="nav-btn" routerLink="/contact" (click)="closeMenu()">Get started <span aria-hidden="true">&rarr;</span></a>
      </div>
    </nav>

    <button type="button" class="hamburger" [class.active]="menuOpen" [attr.aria-expanded]="menuOpen" aria-controls="primary-navigation" [attr.aria-label]="menuOpen ? 'Close navigation menu' : 'Open navigation menu'" (click)="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
