<section class="contact-hero">
  <div class="contact-content">
    <h1>Get In Touch</h1>
    <p class="subtitle">We'd love to hear from you. Send us a message!</p>
  </div>
</section>

<section class="contact-section">
  <div class="contact-container">
    <!-- Contact Info Cards -->
    <div class="contact-info-grid">
      <div class="info-card" *ngFor="let info of contactInfo">
        <div class="info-icon">{{ info.icon }}</div>
        <h3>{{ info.title }}</h3>
        <p>{{ info.details }}</p>
      </div>
    </div>

    <!-- Contact Form -->
    <div class="form-section">
      <h2>Send Us a Message</h2>
      
      <div *ngIf="submitted" class="success-message">
        ✓ Thank you! We've received your message and will get back to you soon.
      </div>

      <div *ngIf="errorMessage" class="error-message">
        ✗ {{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit()" class="contact-form">
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input 
            type="text" 
            id="name" 
            [(ngModel)]="formData.name" 
            name="name"
            placeholder="Your full name"
            [disabled]="submitting"
            required
          >
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="email">Email Address *</label>
            <input 
              type="email" 
              id="email" 
              [(ngModel)]="formData.email" 
              name="email"
              placeholder="your@email.com"
              [disabled]="submitting"
              required
            >
          </div>

          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input 
              type="tel" 
              id="phone" 
              [(ngModel)]="formData.phone" 
              name="phone"
              placeholder="+1 (555) 123-4567"
              [disabled]="submitting"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="subject">Subject *</label>
          <input 
            type="text" 
            id="subject" 
            [(ngModel)]="formData.subject" 
            name="subject"
            placeholder="What is this about?"
            [disabled]="submitting"
            required
          >
        </div>

        <div class="form-group">
          <label for="message">Message *</label>
          <textarea 
            id="message" 
            [(ngModel)]="formData.message" 
            name="message"
            placeholder="Please describe your inquiry..."
            rows="6"
            [disabled]="submitting"
            required
          ></textarea>
        </div>

        <button type="submit" class="submit-btn" [disabled]="submitting">
          {{ submitting ? 'Sending...' : 'Send Message' }}
        </button>
      </form>
    </div>
  </div>
</section>

<!-- Map Section (placeholder) -->
<section class="map-section">
  <div class="map-placeholder">
    <iframe src="https://www.google.com/maps?q=Piduguralla,+Andhra+Pradesh,+India&output=embed" title="Map to our office in Piduguralla" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>
</section>
